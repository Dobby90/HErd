services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: herd
      POSTGRES_USER: herd
      POSTGRES_PASSWORD: ${HERD_DB_PASSWORD:-herd-local-only}
    ports:
      - "127.0.0.1:${HERD_DB_PORT:-55432}:5432"
    volumes:
      - herd-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "herd", "-d", "herd"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  herd-db:
